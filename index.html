
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CI/CD Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1f2937;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud CI/CD Demo</h1>
        <p>This website is hosted on Amazon S3</p>
        <p class="status">Deployment successful</p>
        <p>Deployed automatically using AWS CodePipeline</p>
        <p>Version 1</p>
    </div>
</body>
</html>
