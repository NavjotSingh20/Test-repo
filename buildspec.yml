version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing Python dependencies..."
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Starting unit tests..."

  build:
    commands:
      - echo "Running pytest..."
      - pytest -v

  post_build:
    commands:
      - echo "Build and testing completed successfully."

artifacts:
  files:
    - app.py
    - test_app.py
    - requirements.txt
    - buildspec.yml
